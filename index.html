der-bottom-right-radius:4px}.th{align-self:flex-start;background:var(--bg);border:1px solid var(--br);border-bottom-left-radius:4px}.th.adm{border-left:3px solid #b45309}.send{display:flex;gap:8px}.send input{margin:0}.send .btn{width:auto;padding:0 18px}.console{background:#0b1020;color:#e5e7eb;border-radius:18px;padding:16px;margin-bottom:14px}.console .mu{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.grid div{background:#151b33;border-radius:12px;padding:12px;font-size:12px;color:#94a3b8}.grid b{display:block;font-size:20px;color:#fff}.note{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}textarea{width:100%;padding:13px 14px;margin:6px 0 12px;border-radius:12px;border:1px solid var(--br);background:var(--bg);color:var(--tx);font-size:15px;min-height:96px;resize:vertical;font-family:inherit}.nav{background:#0b1020;border-top:1px solid #1e2440}.nav button{color:#9ca3af}.nav .ni{background:#151a33}.nav .bdg{border-color:#0b1020}.nav .ni{background:transparent;border-color:transparent;box-shadow:none}.nav button.on .ni{background:#1b2244;border-color:#2f3a6b;box-shadow:none}body.typing .nav{display:none}body.typing{padding-bottom:16px}.cp{background:#ffffff38;color:#fff;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}.toast{background:linear-gradient(135deg,#4f46e5,#7c3aed)}.nav button.on{color:#a5b4fc}@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03);box-shadow:0 0 0 6px #7c3aed59}to{transform:scale(1)}}.menu button{display:flex;align-items:center;gap:10px}.cpi{background:#fff3;border-radius:8px;padding:6px;display:grid;place-items:center;color:#fff}.cnt{background:var(--pr);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;white-space:nowrap}.mi{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-bottom:6px;cursor:pointer}.mi[hidden]{display:none}.trx{margin-top:6px;padding:6px 8px;border-radius .ob-top{text-align:center;margin:10px 0 18px}
.ob-top p{margin:6px 0 0;color:var(--mu);font-size:14px}
.ob-steps{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
.ob-steps .s{display:flex;flex-direction:column;align-items:center;gap:5px}
.ob-steps .s span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--card);border:1.5px solid var(--br);color:var(--mu)}
.ob-steps .s.done span{background:var(--ok);border-color:var(--ok);color:#fff}
.ob-steps .s.on span{background:linear-gradient(135deg,var(--pr),var(--pr2));border-color:transparent;color:#fff;box-shadow:0 0 0 4px #4f46e51f}
.ob-steps em{font-style:normal;font-size:11px;color:var(--mu)}
.ob-steps i{width:46px;height:2px;background:var(--br);margin-bottom:18px;border-radius:2px}
.ob-card{padding:22px 18px}
.ob-av{position:relative;width:104px;height:104px;margin:2px auto 8px}
.ob-pic{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:var(--bg);border:2px dashed var(--pr);color:var(--mu);overflow:hidden}
.ob-pic.has{border-style:solid}
.ob-pic img{width:100%;height:100%;object-fit:cover}
.ob-cam{position:absolute;right:-2px;bottom:-2px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,var(--pr),var(--pr2));border:3px solid var(--card);cursor:pointer}
.ob-hint{text-align:center;margin-bottom:16px;font-size:13px}
.ob-row{display:flex;gap:10px}
.ob-row>div{flex:1;min-width:0}
.vx{margin:6px 0 12px}
.vx-drop{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--pr);border-radius:14px;background:var(--bg);cursor:pointer}
.vx-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--pr),var(--pr2));flex:none}
.vx-t{display:flex;flex-direction:column;min-width:0}
.vx-t b{font-size:14px}
.vx-t small{color:var(--mu);font-size:12px;margin-top:2px}
.vx-prev video{width:100%;max-height:230px;border-radius:12px;background:#000;display:block}
.vx-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.vx-nm{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vx .hide{display:none!important}
.vx-err{margin:6px 0 0;min-height:0}
.vx-note{margin:-6px 0 10px;font-size:12px}
.vx-th{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9;cursor:pointer}
.vx-th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.vx-play,.vx-big{position:absolute;left:50%;top:50%;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;padding-left:3px}
.vx-play{width:54px;height:54px;margin:-27px 0 0 -27px;font-size:22px}
.vx-big{width:60px;height:60px;margin:-30px 0 0 -30px;font-size:24px}
.vx-na{margin-top:10px;padding:14px;border-radius:12px;background:var(--bg);color:var(--mu);font-size:13px;text-align:center}
.vx-pl video{width:100%;max-height:60vh;border-radius:12px;background:#000;display:block;margin-bottom:12px}
.ad video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.pbx{margin-top:10px}
.ptt+.pbx{margin-top:0}
.pbx:empty{display:none}
.vx-done{position:absolute;left:0;right:0;bottom:0;padding:8px;background:#059669e6;color:#fff;font-weight:600;font-size:14px}
.vx-done:empty{display:none}</style>
